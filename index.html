<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>早押しローテーションクイズ</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px;
      background-color: #f4f4f9;
    }
    .card {
      max-width: 650px;
      margin: 0 auto 20px;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .hidden { display: none; }
    input[type="text"], input[type="number"] {
      font-size: 16px;
      padding: 8px 12px;
      border: 2px solid #ccc;
      border-radius: 5px;
      margin: 5px;
    }
    button {
      font-size: 16px;
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      margin: 5px;
    }
    button:hover { background-color: #0056b3; }
    #text-display {
      font-size: 24px;
      font-weight: bold;
      min-height: 80px;
      line-height: 1.5;
      color: #333;
      border: 2px dashed #007bff;
      padding: 15px;
      border-radius: 8px;
      background: #f8f9fa;
      word-break: break-all;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th { background-color: #f2f2f2; }
    
    /* 結果画面のビジュアル用スタイル */
    #visual-question {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.8;
      padding: 15px;
      background: #eef2f5;
      border-radius: 8px;
      margin: 15px 0;
      text-align: left;
      word-break: break-all;
    }
    .char-box {
      display: inline-block;
      padding: 2px 4px;
      margin: 2px 1px;
      border-radius: 4px;
    }
    .player-badge {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .note {
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

  <div id="setup-screen" class="card">
    <h2>クイズの設定</h2>
    <p>問題文、せいかい、参加人数を入力してください。</p>
    <div style="text-align: left; max-width: 400px; margin: 0 auto;">
      <p>問題文：<br>
        <input type="text" id="input-question" style="width:100%;" placeholder="問題文を入力">
      </p>
      <p>せいかい（ひらがなのみ）：<br>
        <input type="text" id="input-answer" style="width:100%;" placeholder="せいかいを入力" onblur="cleanHiragana(this)">
        <span class="note">※確定後にひらがな以外が含まれる場合は自動除去されます</span>
      </p>
      <p>参加人数：<br>
        <input type="number" id="input-players" value="2" min="1" max="5">
      </p>
    </div>
    <button onclick="setupQuiz()">クイズ作成・スタート！</button>
  </div>

  <div id="play-screen" class="card hidden">
    <h2 id="player-turn">プレイヤー 1 の番</h2>
    <div id="text-display">「スタート」を押してね</div>
    <p id="status">スペースキーでストップ！</p>

    <div id="answer-area" style="margin-top: 15px;">
      <input type="text" id="answer-input" placeholder="かいとう（ひらがな）" disabled>
      <button id="submit-btn" onclick="submitAnswer()" disabled>送信</button>
    </div>

    <button id="start-btn" onclick="startQuiz()" style="margin-top: 20px;">スタート</button>
  </div>

  <div id="result-screen" class="card hidden">
    <h2>結果発表！</h2>
    <p id="correct-answer-display" style="font-size: 18px; font-weight: bold;"></p>
    
    <div id="visual-question"></div>

    <table>
      <thead>
        <tr>
          <th>プレイヤー</th>
          <th>かいとう</th>
          <th>読んだ区間</th>
        </tr>
      </thead>
      <tbody id="result-table-body"></tbody>
    </table>
    <button onclick="location.reload()" style="margin-top: 20px;">もう一度遊ぶ</button>
  </div>

  <script>
    // プレイヤーごとの割り当てカラー（最大5人分）
    const playerColors = [
      { bg: "#ffadad", text: "#000" }, // プレイヤー1: 赤系
      { bg: "#ffd6a5", text: "#000" }, // プレイヤー2: オレンジ系
      { bg: "#caffbf", text: "#000" }, // プレイヤー3: 緑系
      { bg: "#9bf6ff", text: "#000" }, // プレイヤー4: 水色系
      { bg: "#a0c4ff", text: "#000" }  // プレイヤー5: 青系
    ];

    let questionText = "";
    let correctAnswer = "";
    let totalPlayers = 0;
    let currentPlayer = 1;

    let startIndex = 0;   
    let currentIndex = 0; 
    let timerId = null;
    let isRunning = false;

    let playerLogs = [];

    function cleanHiragana(input) {
      input.value = input.value.replace(/[^ぁ-んー]/g, "");
    }

    function setupQuiz() {
      questionText = document.getElementById("input-question").value.trim();
      correctAnswer = document.getElementById("input-answer").value.replace(/[^ぁ-んー]/g, "").trim();
      totalPlayers = parseInt(document.getElementById("input-players").value);

      if (!questionText || !correctAnswer || totalPlayers < 1) {
        alert("問題文と正解（ひらがな）を正しく入力してください。");
        return;
      }

      document.getElementById("setup-screen").classList.add("hidden");
      document.getElementById("play-screen").classList.remove("hidden");
      
      prepareTurn();
    }

    function prepareTurn() {
      document.getElementById("player-turn").textContent = `プレイヤー ${currentPlayer} / ${totalPlayers} の番`;
      document.getElementById("status").textContent = "準備ができたら「スタート」を押してください。";
      document.getElementById("start-btn").disabled = false;
      document.getElementById("answer-input").disabled = true;
      document.getElementById("answer-input").value = "";
      document.getElementById("submit-btn").disabled = true;

      document.getElementById("text-display").textContent = "「スタート」を押してね";
    }

    function startQuiz() {
      if (isRunning) return;

      isRunning = true;
      document.getElementById("start-btn").disabled = true;
      document.getElementById("status").textContent = "問題が流れてます...（スペースキーでストップ！）";

      currentIndex = startIndex;
      const displayElement = document.getElementById("text-display");
      displayElement.textContent = "";

      timerId = setInterval(() => {
        if (currentIndex < questionText.length) {
          displayElement.textContent += questionText[currentIndex];
          currentIndex++;
        } else {
          clearInterval(timerId);
          isRunning = false;
          document.getElementById("status").textContent = "問題終了！解答を入力してください。(ひらがなのみ)";
          enableAnswerInput();
        }
      }, 150);
    }

    document.addEventListener("keydown", (event) => {
      const answerInput = document.getElementById("answer-input");
      if (document.activeElement === answerInput) return;

      if (event.code === "Space") {
        event.preventDefault();

        if (isRunning) {
          clearInterval(timerId);
          isRunning = false;
          document.getElementById("status").textContent = "🛑 停止！解答を入力してください。(ひらがなのみ)";
          enableAnswerInput();
        }
      }
    });

    function enableAnswerInput() {
      const answerInput = document.getElementById("answer-input");
      answerInput.disabled = false;
      document.getElementById("submit-btn").disabled = false;
      answerInput.focus();
    }

    document.getElementById("answer-input").addEventListener("keydown", (event) => {
      if (event.key === "Enter") submitAnswer();
    });

    function submitAnswer() {
      const answerInput = document.getElementById("answer-input");
      const answerText = answerInput.value.replace(/[^ぁ-んー]/g, "").trim();

      if (!answerText) {
        alert("ひらがなで解答を入力してください。");
        return;
      }

      playerLogs.push({
        player: currentPlayer,
        answer: answerText,
        startAt: startIndex,
        stoppedAt: currentIndex 
      });

      startIndex = currentIndex;
      currentPlayer++;

      if (currentPlayer > totalPlayers || startIndex >= questionText.length) {
        showResults();
      } else {
        alert(`プレイヤー ${currentPlayer - 1} のターン終了！画面を次の人へ渡してください。`);
        prepareTurn();
      }
    }

    // 色分けによる結果表示機能
    function showResults() {
      document.getElementById("play-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");

      document.getElementById("correct-answer-display").textContent = `【せいかい】: ${correctAnswer}`;

      // 1. 問題文を1文字ずつプレイヤーの色で塗り分けて構築
      const visualBox = document.getElementById("visual-question");
      let visualHtml = "";

      for (let i = 0; i < questionText.length; i++) {
        // この文字を担当したプレイヤーを特定
        const log = playerLogs.find(p => i >= p.startAt && i < p.stoppedAt);
        
        if (log) {
          const color = playerColors[(log.player - 1) % playerColors.length];
          visualHtml += `<span class="char-box" style="background-color: ${color.bg}; color: ${color.text};">${questionText[i]}</span>`;
        } else {
          // 誰にも読まれなかった余り文字
          visualHtml += `<span class="char-box" style="background-color: #e0e0e0; color: #888;">${questionText[i]}</span>`;
        }
      }
      visualBox.innerHTML = visualHtml;

      // 2. テーブル（一覧表）の生成
      const tbody = document.getElementById("result-table-body");
      tbody.innerHTML = "";

      playerLogs.forEach(log => {
        const tr = document.createElement("tr");
        const isCorrect = (log.answer === correctAnswer);
        const mark = isCorrect ? "⭕️ " : "❌ ";
        const color = playerColors[(log.player - 1) % playerColors.length];

        tr.innerHTML = `
          <td>
            <span class="player-badge" style="background-color: ${color.bg};"></span>
            プレイヤー ${log.player}
          </td>
          <td style="font-weight: bold; color: ${isCorrect ? 'red' : 'black'};">${mark}${log.answer}</td>
          <td>${log.startAt + 1}〜${log.stoppedAt} 文字目</td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>

</body>
</html>
